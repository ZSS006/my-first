<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Interior Design</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    :root {
      --gold: #d4af37;
      --dark-bg: #111827;
    }

    body {
      background-color: var(--dark-bg);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .serif {
      font-family: 'Playfair Display', 'Georgia', serif;
    }

    .gold, .text-gold {
      color: var(--gold) !important;
    }

    .section-padding {
      padding: 80px 0;
    }

    /* Navbar */
    .navbar {
      background-color: var(--dark-bg);
      border-bottom: 2px solid var(--gold);
    }

    .nav-link {
      color: #fff !important;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.9rem;
      margin: 0 10px;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--gold) !important;
    }

    /* Project Filter Nav */
    .filter-btn {
      background: none;
      border: none;
      color: #6c757d;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 0.85rem;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
    }

    .filter-btn.active, .filter-btn:hover {
      color: #111111;
    }

    .filter-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 16px;
      right: 16px;
      height: 2px;
      background-color: var(--gold);
    }

    /* Gallery Items */
    .project-item {
      overflow: hidden;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .project-item img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .project-item:hover img {
      transform: scale(1.05);
    }

    .btn-gold {
      background-color: var(--gold);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 0;
    }

    .btn-gold:hover {
      background-color: #b89628;
      color: #fff;
    }

    footer {
      border-top: 3px solid var(--gold);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand serif fs-3 text-gold fw-bold" href="index.html">Interior</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">SERVICES</a></li>
          <li class="nav-item"><a class="nav-link active" href="projects.html">PROJECTS</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">GALLERY</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#contact">CONTACT</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Projects Section -->
  <section class="section-padding" style="background-color: #f8f9fa;">
    <div class="container">
      
      <!-- Heading -->
      <div class="text-center mb-4">
        <h2 class="display-4 serif fw-bold text-dark">
          Featured <span class="gold">Projects</span>
        </h2>
      </div>

      <!-- Filter Tabs -->
      <div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
        <button class="filter-btn active" data-filter="all">ALL</button>
        <button class="filter-btn" data-filter="living-room">LIVING ROOM</button>
        <button class="filter-btn" data-filter="bedroom">BEDROOM</button>
        <button class="filter-btn" data-filter="kitchen">KITCHEN</button>
      </div>

      <!-- Projects Grid -->
      <div class="row g-4" id="project-grid">
        
        <!-- Project 1: Living Room -->
        <div class="col-md-4 project-card" data-category="living-room">
          <div class="project-item shadow-sm">
            <img src="https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Living Room Design" />
          </div>
        </div>





        
        <!-- Project 2: Bedroom -->
        <div class="col-md-4 project-card" data-category="bedroom">
          <div class="project-item shadow-sm">
            <img src="https://images.pexels.com/photos/271624/pexels-photo-271624.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Bedroom Interior" />
          </div>
        </div>

        <!-- Project 3: Kitchen -->
        <div class="col-md-4 project-card" data-category="kitchen">
          <div class="project-item shadow-sm">
            <img src="https://images.pexels.com/photos/1080721/pexels-photo-1080721.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Modular Kitchen" />
          </div>
        </div>

        <!-- Project 4: Living Room -->
        <div class="col-md-4 project-card" data-category="living-room">
          <div class="project-item shadow-sm">
            <img src="https://images.pexels.com/photos/1643383/pexels-photo-1643383.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Modern Sofa" />
          </div>
        </div>

        <!-- Project 5: Bedroom -->
        <div class="col-md-4 project-card" data-category="bedroom">
          <div class="project-item shadow-sm">
            <img src="https://images.pexels.com/photos/1457842/pexels-photo-1457842.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Master Bedroom" />
          </div>
        </div>

        <!-- Project 6: Kitchen -->
        <div class="col-md-4 project-card" data-category="kitchen">
          <div class="project-item shadow-sm">

          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white py-5">

      <div class="row g-4">
        <div class="col-md-4">
          <h5 class="serif gold">Interior Design</h5>
          <p class="text-white-50">We create places that deserve to be called Home.</p>
          <div class="fs-5">

        <div class="col-md-4">
          <h5 class="serif gold">Newsletter</h5>
          <div class="d-flex flex-column gap-2">
            <input type="email" placeholder="Email" class="form-control rounded-0">

      </div>
      <hr class="mt-4 border-secondary">
      <div class="text-center text-white-50 small">© 2026. All rights reserved Zyyron.</div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Category Filter Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filterBtns = document.querySelectorAll(".filter-btn");
      const projectCards = document.querySelectorAll(".project-card");

      filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          // Remove active class from all buttons
          filterBtns.forEach(b => b.classList.remove("active"));
          // Add active class to clicked button
          btn.classList.add("active");

          const filterValue = btn.getAttribute("data-filter");

          projectCards.forEach(card => {
            if (filterValue === "all" || card.getAttribute("data-category") === filterValue) {
              card.style.display = "block";
            } else {
              card.style.display = "none";
            }
          });
        });
      });
    });
  </script>
</body>
